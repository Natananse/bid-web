version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: bidnest-postgres
    environment:
      POSTGRES_USER: bidnest
      POSTGRES_PASSWORD: bidnest_password
      POSTGRES_DB: bidnest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bidnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: bidnest-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: always

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/bidnest-images --ignore-existing;
      /usr/bin/mc anonymous set public myminio/bidnest-images;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
